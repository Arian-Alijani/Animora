  - ADR-0002-local-schema-mirroring
  - ADR-0003-module-boundary-and-communication
  - ADR-0004-read-write-path-split
  - ADR-0005-tenancy-isolation-mechanism
  - ADR-0006-entitlement-enforcement-split
  - ADR-0007-invoice-ledger-immutability
  - ADR-0008-calendar-scheduling-data-model
  - ADR-0009-desktop-offline-job-ownership
  - ADR-0010-api-versioning-strategy
  - ADR-0011-web-offline-scope-limitation
  - ADR-0012-cheque-cash-session-state-ownership
